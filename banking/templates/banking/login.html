<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | SmartBank 360</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;color:#1e293b}
.box{background:white;padding:30px;border-radius:12px;width:min(400px,90%);box-shadow:0 4px 18px #0001}
h1{color:#102a43}label{display:block;margin-top:15px}
input{width:100%;padding:11px;margin-top:7px;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;padding:12px;width:100%;border-radius:7px;margin-top:20px;cursor:pointer}
.error{color:#b91c1c}
a{color:#2563eb}
</style>
</head>
<body>
<div class="box">
<h1>SmartBank 360</h1>
<p>Customer Login</p>
{% if messages %}
{% for message in messages %}<p>{{ message }}</p>{% endfor %}
{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
{% csrf_token %}
<label for="username">Username</label>
<input id="username" type="text" name="username" required>
<label for="password">Password</label>
<input id="password" type="password" name="password" required>
<button type="submit">Log In</button>
</form>
<p>New customer? <a href="{% url 'register' %}">Create an account</a></p>
</div>
</body>
</html>
